services:
  web:
    image: nginx:1.27-alpine
    restart: on-failure
    ports:
      - "3000:80"
    volumes:
      # Site source is bind-mounted, so edits show up without a rebuild.
      - ./site:/usr/share/nginx/html:ro
      - ./site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
