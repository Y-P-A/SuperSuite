<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2048 — SuperSuite</title>
    <meta name="description" content="Slide the tiles, merge the numbers, and reach 2048." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/games/2048">
    <main class="wrap wrap--narrow">
      <section class="panel">
        <div class="hud">
          <div class="hud__item"><span class="hud__label">Score</span><span class="hud__value" id="score">0</span></div>
          <div class="hud__item"><span class="hud__label">Best</span><span class="hud__value" id="best">0</span></div>
          <div class="hud__item"><span class="hud__label">Top tile</span><span class="hud__value" id="top">2</span></div>
        </div>

        <div class="stage">
          <div class="board" id="board" aria-label="2048 board"></div>
          <div class="stage__overlay is-visible" id="overlay">
            <div>
              <h3 data-overlay-title>2048</h3>
              <p data-overlay-text>Arrow keys or WASD to slide. Matching tiles merge — get to 2048.</p>
              <button class="btn btn--primary" type="button" data-overlay-button>Start</button>
            </div>
          </div>
        </div>

        <div class="spread" style="margin-top: 14px">
          <span class="small muted">On a phone, swipe the board.</span>
          <div class="btn-row">
            <button class="btn" type="button" id="restart">New game</button>
          </div>
        </div>

        <div class="pad" id="pad">
          <div class="pad__row"><button class="btn" type="button" data-key="ArrowUp">&uarr;</button></div>
          <div class="pad__row">
            <button class="btn" type="button" data-key="ArrowLeft">&larr;</button>
            <button class="btn" type="button" data-key="ArrowDown">&darr;</button>
            <button class="btn" type="button" data-key="ArrowRight">&rarr;</button>
          </div>
        </div>

        <ul class="keys">
          <li><span class="kbd">↑</span><span class="kbd">↓</span><span class="kbd">←</span><span class="kbd">→</span> or <span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span> to slide &nbsp;·&nbsp; <span class="kbd">R</span> new game</li>
        </ul>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/games/common.js"></script>
    <script src="/assets/js/games/2048.js"></script>
  </body>
</html>
