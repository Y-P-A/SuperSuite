<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Asteroids — SuperSuite</title>
    <meta name="description" content="Drift, shoot and dodge — clear the rocks before they hit you." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/games/asteroids">
    <main class="wrap">
      <section class="panel">
        <div class="hud">
          <div class="hud__item"><span class="hud__label">Score</span><span class="hud__value" id="score">0</span></div>
          <div class="hud__item"><span class="hud__label">Lives</span><span class="hud__value" id="lives">3</span></div>
          <div class="hud__item"><span class="hud__label">Wave</span><span class="hud__value" id="wave">1</span></div>
          <div class="hud__item"><span class="hud__label">Best</span><span class="hud__value" id="best">0</span></div>
        </div>

        <div class="stage">
          <canvas id="field" width="640" height="480" aria-label="Asteroids board"></canvas>
          <div class="stage__overlay is-visible" id="overlay">
            <div>
              <h3 data-overlay-title>Ready?</h3>
              <p data-overlay-text>Left and right steer, up thrusts, Space fires. The screen wraps around.</p>
              <button class="btn btn--primary" type="button" data-overlay-button>Start</button>
            </div>
          </div>
        </div>

        <div class="spread" style="margin-top: 14px">
          <span class="small muted">Big rocks split into small ones — clear them all to reach the next wave.</span>
          <div class="btn-row">
            <button class="btn" type="button" id="pause">Pause</button>
            <button class="btn" type="button" id="restart">Restart</button>
          </div>
        </div>

        <div class="pad" id="pad">
          <div class="pad__row">
            <button class="btn" type="button" data-key="ArrowLeft">&larr;</button>
            <button class="btn" type="button" data-key="ArrowUp">Thrust</button>
            <button class="btn" type="button" data-key="ArrowRight">&rarr;</button>
          </div>
          <div class="pad__row"><button class="btn" type="button" data-key="Space">Fire</button></div>
        </div>

        <ul class="keys">
          <li><span class="kbd">←</span><span class="kbd">→</span> steer &nbsp;·&nbsp; <span class="kbd">↑</span> thrust &nbsp;·&nbsp; <span class="kbd">Space</span> fire &nbsp;·&nbsp; <span class="kbd">P</span> pause &nbsp;·&nbsp; <span class="kbd">R</span> restart</li>
        </ul>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/games/common.js"></script>
    <script src="/assets/js/games/asteroids.js"></script>
  </body>
</html>
