<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breakout — SuperSuite</title>
    <meta name="description" content="Break every brick, keep the ball alive and clear the levels." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body>
    <main class="wrap wrap--narrow">
      <p class="small"><a href="/games/">&larr; All games</a></p>

      <section class="panel t-orange">
        <div class="panel__head">
          <div>
            <h1>Breakout</h1>
            <p class="muted small">Six rows of bricks, three lives, and a ball that keeps getting faster.</p>
          </div>
          <span class="badge">Game 03</span>
        </div>

        <div class="hud">
          <div class="hud__item"><span class="hud__label">Score</span><span class="hud__value" id="score">0</span></div>
          <div class="hud__item"><span class="hud__label">Lives</span><span class="hud__value" id="lives">3</span></div>
          <div class="hud__item"><span class="hud__label">Level</span><span class="hud__value" id="level">1</span></div>
          <div class="hud__item"><span class="hud__label">Best</span><span class="hud__value" id="best">0</span></div>
        </div>

        <div class="stage">
          <canvas id="field" width="800" height="560" aria-label="Breakout field"></canvas>
          <div class="stage__overlay is-visible" id="overlay">
            <div>
              <h3 data-overlay-title>Ready?</h3>
              <p data-overlay-text>Move with the arrow keys, W/S or your mouse. Space launches the ball.</p>
              <button class="btn btn--primary" type="button" data-overlay-button>Start</button>
            </div>
          </div>
        </div>

        <div class="spread" style="margin-top: 14px">
          <span class="small muted">Every brick makes the ball a little quicker.</span>
          <div class="btn-row">
            <button class="btn" type="button" id="pause">Pause</button>
            <button class="btn" type="button" id="restart">Restart</button>
          </div>
        </div>

        <div class="pad" id="pad">
          <div class="pad__row">
            <button class="btn" type="button" data-key="ArrowLeft">&larr;</button>
            <button class="btn" type="button" data-key="Space">Launch</button>
            <button class="btn" type="button" data-key="ArrowRight">&rarr;</button>
          </div>
        </div>
      </section>
    </main>

    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/games/common.js"></script>
    <script src="/assets/js/games/breakout.js"></script>
  </body>
</html>
