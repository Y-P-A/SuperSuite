<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Connect Four — SuperSuite</title>
    <meta name="description" content="Drop the discs, line up four, and outsmart the CPU." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/games/connect-four">
    <main class="wrap wrap--narrow">
      <section class="panel">
        <div class="hud">
          <div class="hud__item"><span class="hud__label">You</span><span class="hud__value" id="wins">0</span></div>
          <div class="hud__item"><span class="hud__label">CPU</span><span class="hud__value" id="losses">0</span></div>
          <div class="hud__item"><span class="hud__label">Draws</span><span class="hud__value" id="draws">0</span></div>
        </div>

        <div class="row" style="margin-bottom:14px">
          <div class="chips" id="modes">
            <button class="chip is-active" type="button" data-mode="cpu">Beat the CPU</button>
            <button class="chip" type="button" data-mode="friend">Two players</button>
          </div>
          <div class="btn-row" style="margin-left:auto">
            <button class="btn btn--primary" type="button" id="new">New game</button>
          </div>
        </div>

        <div class="stage">
          <div class="cf" id="board" aria-label="Connect four board"></div>
          <div class="stage__overlay is-visible" id="overlay">
            <div>
              <h3 data-overlay-title>Connect Four</h3>
              <p data-overlay-text>You are red and you go first. Drop discs to line up four in a row.</p>
              <button class="btn btn--primary" type="button" data-overlay-button>Start</button>
            </div>
          </div>
        </div>

        <p class="small muted" id="turn" style="margin-top:14px">Your turn — pick a column.</p>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/games/common.js"></script>
    <script src="/assets/js/games/connect-four.js"></script>
  </body>
</html>
