<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jumper — SuperSuite</title>
    <meta name="description" content="Bounce from platform to platform and climb as high as you can." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/games/jumper">
    <main class="wrap wrap--narrow">
      <section class="panel">
        <div class="hud">
          <div class="hud__item"><span class="hud__label">Height</span><span class="hud__value" id="score">0</span></div>
          <div class="hud__item"><span class="hud__label">Best</span><span class="hud__value" id="best">0</span></div>
        </div>

        <div class="stage stage--narrow">
          <canvas id="field" width="380" height="520" aria-label="Jumper board"></canvas>
          <div class="stage__overlay is-visible" id="overlay">
            <div>
              <h3 data-overlay-title>Ready?</h3>
              <p data-overlay-text>You bounce automatically. Steer with left and right — the walls wrap around.</p>
              <button class="btn btn--primary" type="button" data-overlay-button>Start</button>
            </div>
          </div>
        </div>

        <div class="spread" style="margin-top: 14px">
          <span class="small muted">Keep climbing — the higher you get, the higher the score.</span>
          <div class="btn-row">
            <button class="btn" type="button" id="pause">Pause</button>
            <button class="btn" type="button" id="restart">Restart</button>
          </div>
        </div>

        <div class="pad" id="pad">
          <div class="pad__row">
            <button class="btn" type="button" data-key="ArrowLeft">&larr;</button>
            <button class="btn" type="button" data-key="ArrowRight">&rarr;</button>
          </div>
        </div>

        <ul class="keys">
          <li><span class="kbd">←</span><span class="kbd">→</span> or <span class="kbd">A</span><span class="kbd">D</span> steer &nbsp;·&nbsp; <span class="kbd">P</span> pause &nbsp;·&nbsp; <span class="kbd">R</span> restart</li>
        </ul>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/games/common.js"></script>
    <script src="/assets/js/games/jumper.js"></script>
  </body>
</html>
