<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lights Out — SuperSuite</title>
    <meta name="description" content="Click a square and its neighbours flip. Turn every light off in as few moves as you can." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/games/lights-out">
    <main class="wrap wrap--narrow">
      <section class="panel">
        <div class="hud">
          <div class="hud__item"><span class="hud__label">Moves</span><span class="hud__value" id="moves">0</span></div>
          <div class="hud__item"><span class="hud__label">Lights on</span><span class="hud__value" id="lit">0</span></div>
          <div class="hud__item"><span class="hud__label">Best (fewest)</span><span class="hud__value" id="best">—</span></div>
        </div>

        <div class="stage stage--pixel">
          <canvas id="field" width="480" height="480" aria-label="Lights Out board"></canvas>
          <div class="stage__overlay is-visible" id="overlay">
            <div>
              <h3 data-overlay-title>Ready?</h3>
              <p data-overlay-text>Click a square to flip it and its four neighbours. Turn every light off to win.</p>
              <button class="btn btn--primary" type="button" data-overlay-button>Start</button>
            </div>
          </div>
        </div>

        <div class="spread" style="margin-top: 14px">
          <span class="small muted">Every puzzle is made by flipping squares, so it can always be solved.</span>
          <div class="btn-row">
            <button class="btn" type="button" id="restart">New puzzle</button>
          </div>
        </div>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/games/common.js"></script>
    <script src="/assets/js/games/lights-out.js"></script>
  </body>
</html>
