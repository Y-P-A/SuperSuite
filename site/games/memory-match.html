<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Match — SuperSuite</title>
    <meta name="description" content="Flip the cards and find every matching pair from memory." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/games/memory-match">
    <main class="wrap wrap--narrow">
      <section class="panel">
        <div class="hud">
          <div class="hud__item"><span class="hud__label">Moves</span><span class="hud__value" id="moves">0</span></div>
          <div class="hud__item"><span class="hud__label">Pairs</span><span class="hud__value" id="pairs">0</span></div>
          <div class="hud__item"><span class="hud__label">Time</span><span class="hud__value" id="time">0:00</span></div>
          <div class="hud__item"><span class="hud__label">Best</span><span class="hud__value" id="best">—</span></div>
        </div>

        <div class="row" style="margin-bottom:14px">
          <div class="chips" id="sizes">
            <button class="chip is-active" type="button" data-size="4">4 × 4</button>
            <button class="chip" type="button" data-size="6">6 × 6</button>
          </div>
          <div class="btn-row" style="margin-left:auto">
            <button class="btn btn--primary" type="button" id="new">New game</button>
          </div>
        </div>

        <div class="stage">
          <div class="mem" id="board" aria-label="Memory board"></div>
        </div>

        <ul class="keys">
          <li>Click a card to flip it. Two matching cards stay face up; a wrong pair flips back.</li>
        </ul>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/games/common.js"></script>
    <script src="/assets/js/games/memory-match.js"></script>
  </body>
</html>
