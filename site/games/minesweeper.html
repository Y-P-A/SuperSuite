<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minesweeper — SuperSuite</title>
    <meta name="description" content="Flag the mines, clear the board, and beat the clock." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/games/minesweeper">
    <main class="wrap">
      <section class="panel">
        <div class="hud">
          <div class="hud__item"><span class="hud__label">Mines left</span><span class="hud__value" id="mines">10</span></div>
          <div class="hud__item"><span class="hud__label">Time</span><span class="hud__value" id="time">0</span></div>
          <div class="hud__item"><span class="hud__label">Best</span><span class="hud__value" id="best">—</span></div>
        </div>

        <div class="row" style="margin-bottom:14px">
          <div class="chips" id="levels">
            <button class="chip is-active" type="button" data-level="easy">Easy 9×9</button>
            <button class="chip" type="button" data-level="medium">Medium 16×16</button>
            <button class="chip" type="button" data-level="hard">Hard 16×30</button>
          </div>
          <div class="btn-row" style="margin-left:auto">
            <button class="btn btn--primary" type="button" id="new">New game</button>
            <button class="btn" type="button" id="flag-mode">Flag mode: off</button>
          </div>
        </div>

        <div class="table-wrap">
          <div class="ms" id="board" aria-label="Minesweeper board"></div>
        </div>

        <p class="small muted" id="status" style="margin-top:14px">Click a square to start — the first click is always safe.</p>

        <ul class="keys">
          <li>Left click reveals &nbsp;·&nbsp; right click flags &nbsp;·&nbsp; on a phone, use Flag mode.</li>
        </ul>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/games/common.js"></script>
    <script src="/assets/js/games/minesweeper.js"></script>
  </body>
</html>
