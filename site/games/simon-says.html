<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simon Says — SuperSuite</title>
    <meta name="description" content="Watch the colour sequence, then repeat it — it gets longer every round." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/games/simon-says">
    <main class="wrap wrap--narrow">
      <section class="panel">
        <div class="hud">
          <div class="hud__item"><span class="hud__label">Round</span><span class="hud__value" id="round">0</span></div>
          <div class="hud__item"><span class="hud__label">Best</span><span class="hud__value" id="best">0</span></div>
          <div class="hud__item"><span class="hud__label">Speed</span><span class="hud__value" id="speed">1×</span></div>
        </div>

        <div class="stage">
          <div class="simon" id="board" aria-label="Simon board"></div>
        </div>

        <p class="small muted" id="status" style="margin-top:14px">Press Start, watch the sequence, then repeat it.</p>

        <div class="btn-row" style="margin-top:14px">
          <button class="btn btn--primary" type="button" id="start">Start</button>
          <button class="btn" type="button" id="replay">Replay sequence</button>
        </div>

        <ul class="keys">
          <li>Click a pad, or use the keys <span class="kbd">1</span><span class="kbd">2</span><span class="kbd">3</span><span class="kbd">4</span>.</li>
        </ul>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/games/common.js"></script>
    <script src="/assets/js/games/simon-says.js"></script>
  </body>
</html>
