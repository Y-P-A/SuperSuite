server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs: /tools/calculator -> /tools/calculator.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # New Build 0.7 tools share a renderer; only registered slugs match here.
    location ~ ^/tools/(fraction-calculator|statistics|prime-checker|gcd-lcm|quadratic-solver|linear-system|triangle-solver|circle-calculator|volume-calculator|compound-interest|simple-interest|investment-return|scientific-notation|number-sequence|combinatorics|probability|ratio-calculator|rounding|random-numbers|matrix-calculator|distance-calculator|logarithm|regex-tester|csv-json|json-path|json-merge|json-schema|uuid-generator|timestamp|url-parser|query-builder|html-escape|css-units|css-clamp|flexbox|grid-builder|robots-builder|meta-tags|sql-insert|http-status|ip-subnet|jwt-inspector|hmac|byte-inspector|json-table|line-sorter|duplicate-lines|whitespace-cleaner|find-replace|text-reverser|unicode-inspector|unicode-styler|text-wrapper|line-numbering|list-formatter|text-extractor|html-text|readability|frequency|n-grams|text-chunker|prefix-suffix|delimiter-converter|accent-remover|punctuation-cleaner|text-compare|contrast-checker|palette-generator|color-mixer|color-harmonies|hex-rgb|aspect-ratio|dpi-calculator|svg-pattern|svg-shape|avatar-maker|banner-maker|placeholder-image|favicon-maker|border-radius|box-shadow|text-shadow|css-filter|clip-path|typography-scale|spacing-scale|bezier|animation-builder|bpm-delay|note-frequency|tone-generator|audio-duration|pomodoro|habit-tracker|daily-planner|budget-planner|savings-goal|salary-converter|time-duration|time-zone|business-days|week-number|countdown-date|calendar-maker|packing-list|decision-picker|weighted-picker|fuel-cost|travel-time|pace-calculator|recipe-scaler|water-estimate|sleep-planner|meeting-agenda)$ {
        try_files $uri /tools/workbench.html;
    }

    location ~ /\. {
        deny all;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
