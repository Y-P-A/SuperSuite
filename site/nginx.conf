server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Development serving: never cache, so edits show up on refresh.
    add_header Cache-Control "no-store, must-revalidate" always;

    # Clean URLs: /tools/calculator -> /tools/calculator.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location ~ /\. {
        deny all;
    }

    location = /__health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
