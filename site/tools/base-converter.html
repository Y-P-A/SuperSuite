<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Base Converter — SuperSuite</title>
    <meta name="description" content="Convert between binary, octal, decimal and hexadecimal as you type." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/tools/base-converter">
    <main class="wrap wrap--narrow">
      <section class="panel">
        <div class="row">
          <div class="field field--grow">
            <label for="input">Value</label>
            <input class="input mono" id="input" type="text" value="255" spellcheck="false" />
          </div>
          <div class="field field--grow">
            <label for="from">From base</label>
            <select class="select" id="from"></select>
          </div>
        </div>

        <div class="stack" style="margin-top:16px">
          <div class="field"><label>Binary (2)</label><div class="output mono" id="bin"></div></div>
          <div class="field"><label>Octal (8)</label><div class="output mono" id="oct"></div></div>
          <div class="field"><label>Decimal (10)</label><div class="output mono" id="dec"></div></div>
          <div class="field"><label>Hexadecimal (16)</label><div class="output mono" id="hex"></div></div>
          <div class="field"><label>Base 36</label><div class="output mono" id="b36"></div></div>
        </div>

        <p class="note" id="status" style="margin-top:14px"></p>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/base-converter.js"></script>
  </body>
</html>
