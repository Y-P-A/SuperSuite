<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BMI Calculator — SuperSuite</title>
    <meta name="description" content="Work out your BMI in metric or imperial units, see which range it falls in, and find your healthy weight window." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/tools/bmi-calculator">
    <main class="wrap wrap--narrow">
      <section class="panel">
        <div class="field">
          <label for="units">Units</label>
          <select class="select" id="units">
            <option value="metric" selected>Metric (cm / kg)</option>
            <option value="imperial">Imperial (ft, in / lb)</option>
          </select>
        </div>

        <div class="two-col" style="margin-top: 18px">
          <div class="stack" id="metric-fields">
            <div class="field">
              <label for="cm">Height (cm)</label>
              <input class="input mono" type="text" id="cm" inputmode="decimal" value="175" autocomplete="off" />
            </div>
            <div class="field">
              <label for="kg">Weight (kg)</label>
              <input class="input mono" type="text" id="kg" inputmode="decimal" value="70" autocomplete="off" />
            </div>
          </div>

          <div class="stack" id="imperial-fields" hidden>
            <div class="field">
              <label for="ft">Height (ft)</label>
              <input class="input mono" type="text" id="ft" inputmode="numeric" value="5" autocomplete="off" />
            </div>
            <div class="field">
              <label for="inch">Height (in)</label>
              <input class="input mono" type="text" id="inch" inputmode="decimal" value="9" autocomplete="off" />
            </div>
            <div class="field">
              <label for="lb">Weight (lb)</label>
              <input class="input mono" type="text" id="lb" inputmode="decimal" value="154" autocomplete="off" />
            </div>
          </div>

          <div class="stack">
            <div class="hud">
              <div class="hud__item"><span class="hud__label">Your BMI</span><span class="hud__value" id="bmi">—</span></div>
              <div class="hud__item"><span class="hud__label">Category</span><span class="hud__value" id="category">—</span></div>
            </div>

            <div class="field">
              <span class="label">Where you sit</span>
              <div class="meter"><span class="meter__fill" id="meter"></span></div>
              <div class="bmi-scale small muted">
                <span>Under 18.5</span><span>18.5–24.9</span><span>25–29.9</span><span>30+</span>
              </div>
            </div>

            <p class="note mono small" id="range">—</p>
          </div>
        </div>

        <ul class="keys">
          <li>BMI is a rough screening number, not a diagnosis — it ignores muscle, bone and body shape.</li>
          <li>The healthy range shown is the weight window that would put you between 18.5 and 24.9 at your height.</li>
        </ul>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/bmi-calculator.js"></script>
  </body>
</html>
