<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Case Converter — SuperSuite</title>
    <meta name="description" content="Convert text to upper, lower, title, sentence, camelCase, snake_case and more." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/tools/case-converter">
    <main class="wrap wrap--narrow">
      <section class="panel">
        <div class="field">
          <label for="input">Input</label>
          <textarea class="textarea" id="input" rows="6" placeholder="Type or paste the text you want to convert."></textarea>
        </div>


        <div class="field" style="margin-top:14px">
          <label for="modes">Convert to</label>
          <select class="select" id="modes">
            <option value="upper">UPPER</option>
            <option value="lower">lower</option>
            <option value="title">Title Case</option>
            <option value="sentence">Sentence case</option>
            <option value="camel">camelCase</option>
            <option value="pascal">PascalCase</option>
            <option value="snake">snake_case</option>
            <option value="kebab">kebab-case</option>
            <option value="constant">CONSTANT_CASE</option>
            <option value="alternating">aLtErNaTiNg</option>
            <option value="inverse">inVERT cASE</option>
          </select>
        </div>

        <div class="field" style="margin-top:16px">
          <label for="output">Output</label>
          <div class="output" id="output"></div>
        </div>

        <div class="btn-row" style="margin-top:12px">
          <button class="btn" type="button" id="copy">Copy output</button>
          <button class="btn" type="button" id="use">Use as input</button>
        </div>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/case-converter.js"></script>
  </body>
</html>
