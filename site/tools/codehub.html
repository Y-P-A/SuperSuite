<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CodeHub — SuperSuite</title><link rel="icon" href="/assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/assets/css/style.css"><link rel="stylesheet" href="/assets/css/rewind.css"><link rel="stylesheet" href="/assets/css/build07.css"><script src="/assets/js/rewind.js"></script></head>
<body data-page="/tools/codehub"><main class="wrap"><section class="panel cat-coding">
<div class="field code-language"><label for="code-language">Workspace</label><select class="select" id="code-language"><option value="python">Python · Pyodide 314.0.7</option><option value="web">HTML / CSS / JavaScript · together</option><option value="node">Node.js · server runtime</option><option value="c">C · WebAssembly compiler</option><option value="cpp">C++ · WebAssembly compiler</option><option value="java">Java · Judge0 CE</option><option value="kotlin">Kotlin · Judge0 CE</option></select></div>
<p class="note" id="code-runtime-note"></p>
<div id="code-source"><label class="label" for="code-editor">Source code</label><textarea class="textarea code-editor" id="code-editor" spellcheck="false"></textarea><div class="field"><label for="code-stdin">Standard input</label><textarea class="textarea" id="code-stdin" rows="3"></textarea></div></div>
<div class="code-web" id="code-web" hidden><div class="field"><label for="code-html">HTML</label><textarea class="textarea" id="code-html" spellcheck="false">&lt;h1&gt;Hello SuperSuite&lt;/h1&gt;&lt;button onclick="document.querySelector('h1').textContent='It works!'"&gt;Try me&lt;/button&gt;</textarea></div><div class="field"><label for="code-css">CSS</label><textarea class="textarea" id="code-css" spellcheck="false">body { font-family: system-ui; padding: 24px; } h1 { color: teal; }</textarea></div><div class="field"><label for="code-js">JavaScript</label><textarea class="textarea" id="code-js" spellcheck="false">console.log('Ready');</textarea></div></div>
<div class="btn-row" style="margin-top:16px"><button class="btn btn--primary" id="code-run">Run code</button><button class="btn" id="code-stop">Stop</button><button class="btn" id="code-save">Save workspace</button><button class="btn" id="code-download">Download source</button><button class="btn" id="code-reset">Reset example</button></div>
<pre class="output" id="code-output" role="status" style="margin-top:16px">Ready.</pre>
<iframe class="code-preview" id="code-preview" title="HTML CSS JavaScript output" sandbox="allow-scripts" hidden></iframe>
<iframe class="code-preview" id="code-wasm" title="C and C++ WebAssembly compiler" sandbox="allow-scripts allow-same-origin allow-downloads" hidden></iframe>
<p class="small muted">Python runs in a terminable worker. Web previews are isolated from your notes and site storage. Node.js, Java and Kotlin send code and stdin to Judge0 CE only when you press Run; do not include secrets. Public execution availability is not guaranteed.</p>
</section></main><script src="/assets/js/catalog.js"></script><script src="/assets/js/site.js"></script><script src="/assets/js/build07/codehub.js"></script></body></html>
