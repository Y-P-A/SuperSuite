<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cooking Converter — SuperSuite</title>
    <meta name="description" content="Convert cooking measurements — cups, tablespoons, grams, millilitres and ounces — for the ingredient you are actually using." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/tools/cooking-converter">
    <main class="wrap wrap--narrow">
      <section class="panel">
        <div class="field">
          <label for="ingredient">Ingredient</label>
          <select class="select" id="ingredient"></select>
        </div>

        <div class="two-col" style="margin-top: 18px">
          <div class="stack">
            <div class="field">
              <label for="amount">Amount</label>
              <input class="input mono" type="text" id="amount" inputmode="decimal" value="1" autocomplete="off" />
            </div>
            <div class="field">
              <label for="from">From</label>
              <select class="select" id="from"></select>
            </div>
            <div class="btn-row">
              <button class="btn" type="button" id="swap">Swap units</button>
            </div>
          </div>

          <div class="stack">
            <div class="field">
              <label for="to">To</label>
              <select class="select" id="to"></select>
            </div>
            <div class="field">
              <span class="label">Result</span>
              <div class="output">
                <span class="readout mono" id="result">1 cup</span>
              </div>
            </div>
            <div class="btn-row">
              <button class="btn btn--primary" type="button" id="copy">Copy result</button>
              <button class="btn" type="button" id="reset">Reset</button>
            </div>
          </div>
        </div>

        <p class="note mono small" id="sentence">—</p>

        <div class="spread" style="margin-bottom: 8px">
          <span class="label">Quick reference for this ingredient</span>
        </div>
        <div class="table-wrap">
          <table class="table" id="table"></table>
        </div>

        <ul class="keys">
          <li>Flour, sugar, butter and honey all weigh different amounts in the same cup — pick the ingredient and the maths follows.</li>
          <li>Cups, tablespoons and teaspoons here are the US cooking sizes: 1 cup = 16 tbsp = 48 tsp = 240 ml.</li>
        </ul>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/cooking-converter.js"></script>
  </body>
</html>
