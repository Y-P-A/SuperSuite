<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Date Calculator — SuperSuite</title>
    <meta name="description" content="Days between two dates, add or subtract days, and work out exact ages." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/tools/date-calculator">
    <main class="wrap wrap--narrow">
      <section class="panel">
        <div class="field">
          <label for="tabs">Calculation</label>
          <select class="select" id="tabs">
            <option value="between" selected>Days between</option>
            <option value="shift">Add / subtract</option>
            <option value="age">Age</option>
          </select>
        </div>

        <div data-panel="between" style="margin-top:18px">
          <div class="row">
            <div class="field field--grow"><label for="b1">Start date</label><input class="input" id="b1" type="date" /></div>
            <div class="field field--grow"><label for="b2">End date</label><input class="input" id="b2" type="date" /></div>
          </div>
          <div class="output readout" id="r-between" style="margin-top:12px"></div>
        </div>

        <div data-panel="shift" style="margin-top:18px" hidden>
          <div class="row">
            <div class="field field--grow"><label for="s1">Date</label><input class="input" id="s1" type="date" /></div>
            <div class="field field--grow"><label for="s2">Days (+ or −)</label><input class="input" id="s2" type="number" value="30" /></div>
          </div>
          <div class="output readout" id="r-shift" style="margin-top:12px"></div>
        </div>

        <div data-panel="age" style="margin-top:18px" hidden>
          <div class="field" style="max-width:280px"><label for="a1">Date of birth</label><input class="input" id="a1" type="date" /></div>
          <div class="output readout" id="r-age" style="margin-top:12px"></div>
          <p class="small muted" id="a-extra"></p>
        </div>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/date-calculator.js"></script>
  </body>
</html>
