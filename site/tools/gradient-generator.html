<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gradient Generator — SuperSuite</title>
    <meta name="description" content="Build CSS linear gradients, tweak the angle, and copy the code." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/tools/gradient-generator">
    <main class="wrap">
      <section class="panel">
        <div class="two-col">
          <div>
            <div id="preview" class="gradient-preview"></div>
            <div class="row" style="margin-top:12px">
              <div class="field field--grow">
                <label for="angle">Angle — <span id="angle-label">135°</span></label>
                <input type="range" id="angle" min="0" max="360" value="135" />
              </div>
            </div>
            <div class="btn-row" style="margin-top:8px">
              <button class="btn" type="button" id="random">Random</button>
              <button class="btn" type="button" id="reverse">Reverse</button>
            </div>
          </div>

          <div>
            <span class="label" style="display:block;margin-bottom:8px">Color stops</span>
            <div class="stack" id="stops"></div>

            <div class="btn-row" style="margin-top:12px">
              <button class="btn" type="button" id="add">Add stop</button>
              <button class="btn" type="button" id="remove">Remove stop</button>
            </div>

            <div class="field" style="margin-top:16px">
              <label>CSS</label>
              <div class="output mono" id="css"></div>
            </div>
            <div class="btn-row" style="margin-top:10px">
              <button class="btn btn--primary" type="button" id="copy">Copy CSS</button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/gradient-generator.js"></script>
  </body>
</html>
