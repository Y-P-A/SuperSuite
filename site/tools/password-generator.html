<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password Generator — SuperSuite</title>
    <meta name="description" content="Generate strong random passwords in your browser, with a strength meter and one-click copy. Nothing is sent anywhere." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body>
    <main class="wrap wrap--narrow">
      <section class="panel t-red">
        <div class="panel__head">
          <div>
            <h1>Password Generator</h1>
            <p class="muted small">Random passwords built with your browser's own secure random source. Nothing is sent or stored.</p>
          </div>
          <span class="badge">Utility 08</span>
        </div>

        <div class="two-col">
          <div class="stack">
            <div class="field">
              <label for="mode">Generate a</label>
              <select class="select" id="mode">
                <option value="random" selected>Password</option>
                <option value="passphrase">Passphrase</option>
              </select>
            </div>

            <div class="field" id="length-field">
              <label for="length">Length — <span class="mono" id="length-val">20</span> characters</label>
              <input type="range" id="length" min="8" max="64" step="1" value="20" />
            </div>

            <div class="stack" id="phrase-opts" hidden style="gap:10px">
              <div class="field">
                <label for="words">Words — <span class="mono" id="words-val">5</span></label>
                <input type="range" id="words" min="3" max="10" step="1" value="5" />
              </div>
              <div class="field">
                <label for="sep">Separator</label>
                <select class="select" id="sep">
                  <option value="-">Hyphen</option>
                  <option value=".">Dot</option>
                  <option value="_">Underscore</option>
                  <option value=" ">Space</option>
                </select>
              </div>
            </div>

            <div class="stack" style="gap: 10px">
              <label class="check"><input type="checkbox" id="lower" checked /> Lowercase letters (a-z)</label>
              <label class="check"><input type="checkbox" id="upper" checked /> Uppercase letters (A-Z)</label>
              <label class="check"><input type="checkbox" id="digits" checked /> Numbers (0-9)</label>
              <label class="check"><input type="checkbox" id="symbols" checked /> Symbols (!@#$…)</label>
              <label class="check"><input type="checkbox" id="plain" /> Avoid look-alikes (O, 0, l, 1, I)</label>
            </div>

            <div class="btn-row">
              <button class="btn btn--primary" type="button" id="generate">Generate</button>
              <button class="btn" type="button" id="copy">Copy</button>
            </div>
          </div>

          <div class="stack">
            <div class="field">
              <span class="label">Your password</span>
              <div class="output mono" id="out" style="min-height: 78px; font-size: 18px; word-break: break-all">—</div>
            </div>

            <div>
              <div class="meter"><span class="meter__fill" id="meter"></span></div>
              <p class="small muted" id="strength" style="margin-top: 6px">—</p>
            </div>

            <p class="warn" id="error" hidden></p>
          </div>
        </div>

        <ul class="keys">
          <li>Longer beats complicated: 20+ characters is plenty for almost anything.</li>
          <li>Passwords are made on the spot, so closing the tab loses them.</li>
        </ul>
      </section>
    </main>

    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/password-generator.js"></script>
  </body>
</html>
