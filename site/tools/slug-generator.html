<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Slug Generator — SuperSuite</title>
    <meta name="description" content="Turn any headline into a clean, URL-safe slug." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/tools/slug-generator">
    <main class="wrap wrap--narrow">
      <section class="panel">
        <div class="field">
          <label for="input">Headline or title</label>
          <input class="input" id="input" type="text" value="Rewind lets you change the look of the whole site!" />
        </div>

        <div class="row" style="margin-top:14px">
          <div class="field field--grow">
            <label for="sep">Separator</label>
            <select class="select" id="sep">
              <option value="-">Hyphen ( - )</option>
              <option value="_">Underscore ( _ )</option>
              <option value=".">Dot ( . )</option>
            </select>
          </div>
          <div class="field field--grow">
            <label for="max">Max length (0 = no limit)</label>
            <input class="input" id="max" type="number" min="0" max="120" value="60" />
          </div>
        </div>

        <label class="check" style="margin-top:12px"><input type="checkbox" id="stop" /> Drop small words (a, the, of…)</label>
        <label class="check" style="margin-top:6px"><input type="checkbox" id="strip" checked /> Strip accents (café → cafe)</label>

        <div class="field" style="margin-top:16px">
          <label for="output">Slug</label>
          <div class="output" id="output"></div>
        </div>

        <div class="btn-row" style="margin-top:12px">
          <button class="btn btn--primary" type="button" id="copy">Copy slug</button>
        </div>

        <span class="label" style="display:block;margin:18px 0 8px">Recent</span>
        <div class="chips" id="recent"><span class="muted small">Slugs you copy will be listed here.</span></div>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/slug-generator.js"></script>
  </body>
</html>
