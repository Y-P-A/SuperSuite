<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stopwatch — SuperSuite</title>
    <meta name="description" content="A precise stopwatch with laps and keyboard shortcuts." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/tools/stopwatch">
    <main class="wrap wrap--narrow">
      <section class="panel">
        <div class="calc-display" style="text-align:center">
          <div class="calc-display__value" id="display" style="font-size:clamp(34px,9vw,58px)">00:00.00</div>
          <div class="calc-display__expr" id="hint">&nbsp;</div>
        </div>

        <div class="btn-row" style="margin-top:14px">
          <button class="btn btn--primary" type="button" id="start">Start</button>
          <button class="btn" type="button" id="lap" disabled>Lap</button>
          <button class="btn" type="button" id="reset">Reset</button>
        </div>

        <div class="spread" style="margin-top:20px;margin-bottom:8px">
          <span class="label">Laps</span>
          <span class="small muted" id="lap-summary">No laps yet</span>
        </div>
        <ul class="tape" id="laps"><li class="muted">Laps you record will show up here.</li></ul>

        <ul class="keys">
          <li><span class="kbd">Space</span> start / stop &nbsp;·&nbsp; <span class="kbd">L</span> lap &nbsp;·&nbsp; <span class="kbd">R</span> reset</li>
        </ul>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/stopwatch.js"></script>
  </body>
</html>
