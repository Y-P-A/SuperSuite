<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crazy Text Filters — SuperSuite</title>
    <meta name="description" content="Turn plain text into mock, uwu, cursive script, bubble, small caps, leet and more." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body>
    <main class="wrap wrap--narrow">
      <section class="panel t-purple">
        <div class="panel__head">
          <div>
            <h1>Crazy Text Filters</h1>
            <p class="muted small">Pick a filter, get weird text. Chain them if you dare.</p>
          </div>
          <span class="badge">Utility 05</span>
        </div>

        <div class="stack">
          <div class="field">
            <label for="input">Your text</label>
            <textarea class="textarea" id="input" spellcheck="false">SuperSuite has the good stuff.</textarea>
          </div>

          <div class="field">
            <label for="filters">Filter</label>
            <select class="select" id="filters">
              <option value="mock">Mock</option>
              <option value="uwu">UwU</option>
              <option value="script">Script</option>
              <option value="bubble">Bubble</option>
              <option value="smallcaps">Small Caps</option>
              <option value="fullwidth">Fullwidth</option>
              <option value="upsidedown">Upside Down</option>
              <option value="leet">Leet Speak</option>
              <option value="reverse">Reverse</option>
              <option value="morse">Morse</option>
              <option value="nato">NATO Alphabet</option>
              <option value="zalgo">Zalgo</option>
            </select>
            <div class="btn-row"><button class="btn" type="button" id="apply-filter">Apply filter</button></div>
          </div>

          <div class="field">
            <label for="output">Result</label>
            <div class="output" id="output" aria-live="polite"></div>
          </div>

          <div class="btn-row">
            <button class="btn btn--primary" type="button" id="copy-output">Copy result</button>
            <button class="btn" type="button" id="use-output">Use result as input</button>
            <button class="btn" type="button" id="clear">Clear</button>
          </div>

          <label class="row small muted" style="gap: 8px">
            <input type="checkbox" id="chain" />
            Chain: keep filtering the result instead of starting from your text
          </label>
        </div>
      </section>
    </main>

    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/text-filters.js"></script>
  </body>
</html>
