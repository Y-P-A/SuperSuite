<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Todo List — SuperSuite</title>
    <meta name="description" content="A simple checklist that remembers itself — add, tick and clear tasks." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/tools/todo">
    <main class="wrap wrap--narrow">
      <section class="panel">
        <form class="row" id="add-form" autocomplete="off">
          <div class="field field--grow">
            <label for="task">New task</label>
            <input class="input" id="task" type="text" placeholder="What needs doing?" />
          </div>
          <div style="align-self:end"><button class="btn btn--primary" type="submit">Add</button></div>
        </form>

        <div class="spread" style="margin:18px 0 10px">
          <span class="label" id="counts">0 to do</span>
          <div class="btn-row">
            <button class="btn" type="button" id="clear-done">Clear done</button>
            <button class="btn" type="button" id="clear-all">Clear all</button>
          </div>
        </div>

        <ul class="todo" id="list"></ul>
        <p class="note" id="empty">Nothing here yet — add your first task above.</p>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/todo.js"></script>
  </body>
</html>
