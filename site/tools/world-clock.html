<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>World Clock — SuperSuite</title>
    <meta name="description" content="Live clocks for cities around the world, with a quick meeting planner." />
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="stylesheet" href="/assets/css/rewind.css" />
    <script src="/assets/js/rewind.js"></script>
  </head>
  <body data-page="/tools/world-clock">
    <main class="wrap">
      <section class="panel">
        <div class="spread" style="margin-bottom:12px">
          <div>
            <h2 style="margin:0">Your clock</h2>
            <p class="mono readout" id="local" style="margin:0">--:--:--</p>
          </div>
          <span class="badge" id="local-zone">local</span>
        </div>

        <div class="row" style="margin-top:16px">
          <div class="field field--grow"><label for="picker">Add city</label><select class="select" id="picker"></select></div>
          <div class="field field--grow"><label for="remove-city">Remove city</label><select class="select" id="remove-city"></select></div>
        </div>

        <div class="clock-grid" id="clocks" style="margin-top:16px"></div>

        <p class="note" style="margin-top:16px">
          Times update every second from your device's own clock, so they stay correct even across daylight-saving changes.
        </p>
      </section>
    </main>

    <script src="/assets/js/catalog.js"></script>
    <script src="/assets/js/site.js"></script>
    <script src="/assets/js/world-clock.js"></script>
  </body>
</html>
